services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoubivm-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./rootme_api_keys.json:/app/rootme_api_keys.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - tor
    stdin_open: true
    tty: true

  tor:
    build:
      context: ./tor
    container_name: zoubivm-tor
    restart: unless-stopped
